# Catppuccin Mocha theme for Kitty


# Colors
foreground              #cdd6f4
background              #1e1e2e
selection_foreground    #1e1e2e
selection_background    #f5e0dc
background_opacity 0.95
# background_image /Users/steventok/Documents/wallpapers/madoka.jpg
# background_image_layout scaled
# background_tint 0.9

# Cursor
cursor                  #f5e0dc
cursor_text_color       #1e1e2e

# URL underline color when hovering
url_color               #f5e0dc

# Window borders
active_border_color     #b4befe
inactive_border_color   #6c7086
bell_border_color       #f9e2af

# Tab bar
active_tab_foreground   #11111b
active_tab_background   #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #181825
tab_bar_background      #11111b

# Black
color0  #45475a
color8  #585b70

# Red
color1  #f38ba8
color9  #f38ba8

# Green
color2  #a6e3a1
color10 #a6e3a1

# Yellow
color3  #f9e2af
color11 #f9e2af

# Blue
color4  #89b4fa
color12 #89b4fa

# Magenta
color5  #f5c2e7
color13 #f5c2e7

# Cyan
color6  #94e2d5
color14 #94e2d5

# White
color7  #bac2de
color15 #a6adc8

# Font
# Note: kitty only sees the "Mono" variant of Nerd Fonts v3 as monospaced,
# and Bold/Italic are styles within the family, resolved automatically via "auto".
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
